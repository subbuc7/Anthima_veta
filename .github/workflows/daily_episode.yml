name: Anthima Veta - Daily 60s Reel Publisher

on:
  schedule:
    # Runs at 5:00 AM IST every day (23:30 UTC of previous day)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Multimedia & Telugu Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-lohit-telu fonts-telu

      - name: Install Python Dependencies
        run: |
          pip install requests edge-tts pillow

      - name: Run Episode Producer & Instagram Publisher
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python run_daily_episode.py

      - name: Commit State & Episode Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update for episode tracker and output [skip ci]" && git push)
          
